<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fb3ff"/>
    </marker>
    <style>
      .title { fill:#eee; font-size:22px; font-weight:600; }
      .hdr { fill:#8fb3ff; font-size:12px; font-weight:600; letter-spacing:1px; }
      .bt { fill:#f1f1f1; font-size:14px; font-weight:600; text-anchor:middle; }
      .bs { fill:#b9c3d6; font-size:11.5px; text-anchor:middle; }
      .mono { fill:#9fe0b0; font-size:11.5px; font-family:'Cascadia Mono', Consolas, 'Courier New', monospace; text-anchor:middle; }
      .muted { fill:#7f8aa3; font-size:12px; }
      .item { fill:#0f3460; stroke:#23508f; stroke-width:1; }
      .row { fill:#16213e; stroke:#22305a; stroke-width:1; }
      .ext { fill:#16213e; stroke:#2c3d6b; stroke-width:1.2; }
      .line { stroke:#8fb3ff; stroke-width:1.6; fill:none; }
    </style>
  </defs>

  <rect width="1400" height="860" fill="#0d1020"/>
  <text x="30" y="46" class="title">Cogitor IoT Platform &#8212; architecture (v1.0.x)</text>
  <text x="1370" y="46" class="muted" text-anchor="end">single process &#183; multi-account &#183; SQLite or PostgreSQL</text>

  <!-- Platform container -->
  <rect x="270" y="80" width="820" height="740" rx="14" fill="#1a1a2e" stroke="#2f3f73" stroke-width="1.5"/>
  <text x="290" y="110" fill="#eee" font-size="15" font-weight="600">Cogitor IoT Platform &#8212; single Go binary (cmd/platform)</text>

  <!-- Ingress row -->
  <rect x="290" y="126" width="780" height="126" rx="8" class="row"/>
  <text x="304" y="148" class="hdr">INGRESS &#183; HTTP :8080 (chi router)</text>
  <g>
    <rect x="300" y="160" width="120" height="80" rx="6" class="item"/><rect x="300" y="160" width="4" height="80" fill="#3b82f6"/>
    <text x="360" y="189" class="bt">REST API</text><text x="360" y="207" class="bs">/api/v1</text><text x="360" y="223" class="bs">JWT &#183; API tokens</text>

    <rect x="428" y="160" width="120" height="80" rx="6" class="item"/><rect x="428" y="160" width="4" height="80" fill="#3b82f6"/>
    <text x="488" y="189" class="bt">WebSocket</text><text x="488" y="207" class="bs">/api/v1/ws</text><text x="488" y="223" class="bs">live dashboard</text>

    <rect x="556" y="160" width="120" height="80" rx="6" class="item"/><rect x="556" y="160" width="4" height="80" fill="#3b82f6"/>
    <text x="616" y="189" class="bt">MCP</text><text x="616" y="207" class="bs">/mcp</text><text x="616" y="223" class="bs">Streamable HTTP</text>

    <rect x="684" y="160" width="120" height="80" rx="6" class="item"/><rect x="684" y="160" width="4" height="80" fill="#3b82f6"/>
    <text x="744" y="189" class="bt">Setup wizard</text><text x="744" y="207" class="bs">/api/v1/setup/*</text><text x="744" y="223" class="bs">first run only</text>

    <rect x="812" y="160" width="120" height="80" rx="6" class="item"/><rect x="812" y="160" width="4" height="80" fill="#3b82f6"/>
    <text x="872" y="189" class="bt">OTA download</text><text x="872" y="207" class="bs">/ota/fw/{token}</text><text x="872" y="223" class="bs">hosted .bin</text>

    <rect x="940" y="160" width="120" height="80" rx="6" class="item"/><rect x="940" y="160" width="4" height="80" fill="#3b82f6"/>
    <text x="1000" y="189" class="bt">Ops</text><text x="1000" y="207" class="bs">/healthz &#183; /readyz</text><text x="1000" y="223" class="bs">/metrics &#183; ca.pem</text>
  </g>

  <!-- MQTT row -->
  <rect x="290" y="268" width="780" height="112" rx="8" class="row"/>
  <text x="304" y="290" class="hdr">MQTT TRANSPORT &#183; embedded mochi-mqtt</text>
  <g>
    <rect x="300" y="300" width="250" height="70" rx="6" class="item"/><rect x="300" y="300" width="4" height="70" fill="#22c55e"/>
    <text x="425" y="325" class="bt">Listeners</text><text x="425" y="344" class="mono">TCP :1883 &#183; WS :8083</text><text x="425" y="360" class="mono">TLS :8883 (mTLS optional)</text>

    <rect x="558" y="300" width="250" height="70" rx="6" class="item"/><rect x="558" y="300" width="4" height="70" fill="#22c55e"/>
    <text x="683" y="325" class="bt">Auth hook</text><text x="683" y="344" class="bs">device: product.device + token (SHA-256)</text><text x="683" y="360" class="bs">plugins: extplg_{account}_{id}</text>

    <rect x="816" y="300" width="244" height="70" rx="6" class="item"/><rect x="816" y="300" width="4" height="70" fill="#22c55e"/>
    <text x="938" y="325" class="bt">ACL</text><text x="938" y="344" class="bs">devices: own topics (v1/me, iot/v1)</text><text x="938" y="360" class="bs">plugins: rules bus of own account</text>
  </g>

  <!-- Core row -->
  <rect x="290" y="396" width="780" height="196" rx="8" class="row"/>
  <text x="304" y="418" class="hdr">CORE SERVICES (internal/services)</text>
  <g>
    <rect x="300" y="430" width="145" height="68" rx="6" class="item"/><rect x="300" y="430" width="4" height="68" fill="#f59e0b"/>
    <text x="372" y="456" class="bt">Ingest</text><text x="372" y="474" class="bs">telemetry &#183; events</text><text x="372" y="489" class="bs">logs &#183; status</text>

    <rect x="453" y="430" width="145" height="68" rx="6" class="item"/><rect x="453" y="430" width="4" height="68" fill="#f59e0b"/>
    <text x="525" y="456" class="bt">Registry</text><text x="525" y="474" class="bs">products &#183; devices</text><text x="525" y="489" class="bs">schema &#183; tokens</text>

    <rect x="606" y="430" width="145" height="68" rx="6" class="item"/><rect x="606" y="430" width="4" height="68" fill="#f59e0b"/>
    <text x="678" y="456" class="bt">RPC &#183; Attributes</text><text x="678" y="474" class="bs">downlink &#183; NTP</text><text x="678" y="489" class="bs">reported / desired</text>

    <rect x="759" y="430" width="145" height="68" rx="6" class="item"/><rect x="759" y="430" width="4" height="68" fill="#f59e0b"/>
    <text x="831" y="456" class="bt">OTA manager</text><text x="831" y="474" class="bs">jobs &#183; Auto-OTA</text><text x="831" y="489" class="bs">firmware registry</text>

    <rect x="912" y="430" width="148" height="68" rx="6" class="item"/><rect x="912" y="430" width="4" height="68" fill="#f59e0b"/>
    <text x="986" y="456" class="bt">Rules bus</text><text x="986" y="474" class="bs">platform/v1/events/</text><text x="986" y="489" class="bs">{account}/{p}/{d}/&#8230;</text>

    <rect x="300" y="508" width="300" height="72" rx="6" class="item"/><rect x="300" y="508" width="4" height="72" fill="#f59e0b"/>
    <text x="450" y="533" class="bt">Plugin Hub (per-account policies)</text><text x="450" y="552" class="bs">led-garland &#183; schedule</text><text x="450" y="567" class="bs">prometheus-exporter &#183; metrics-dashboard</text>

    <rect x="608" y="508" width="300" height="72" rx="6" class="item"/><rect x="608" y="508" width="4" height="72" fill="#f59e0b"/>
    <text x="758" y="533" class="bt">Auth &amp; tenancy</text><text x="758" y="552" class="bs">JWT &#183; API tokens &#183; Google OAuth</text><text x="758" y="567" class="bs">accounts &#183; members &#183; invitations &#183; audit</text>

    <rect x="916" y="508" width="144" height="72" rx="6" class="item"/><rect x="916" y="508" width="4" height="72" fill="#f59e0b"/>
    <text x="988" y="533" class="bt">Mail</text><text x="988" y="552" class="bs">SMTP or log</text><text x="988" y="567" class="bs">verify &#183; invite</text>
  </g>

  <!-- Storage row -->
  <rect x="290" y="608" width="780" height="104" rx="8" class="row"/>
  <text x="304" y="630" class="hdr">STORAGE</text>
  <g>
    <rect x="300" y="640" width="376" height="62" rx="6" class="item"/><rect x="300" y="640" width="4" height="62" fill="#a855f7"/>
    <text x="488" y="662" class="bt">Database: SQLite (WAL) or PostgreSQL</text><text x="488" y="680" class="bs">accounts &#183; users &#183; products &#183; devices &#183; telemetry</text><text x="488" y="695" class="bs">events &#183; logs &#183; OTA &#183; plugins &#183; audit &#183; settings</text>

    <rect x="684" y="640" width="376" height="62" rx="6" class="item"/><rect x="684" y="640" width="4" height="62" fill="#a855f7"/>
    <text x="872" y="662" class="bt">Data directory &amp; config</text><text x="872" y="680" class="bs">firmware/*.bin &#183; MQTT TLS certs</text><text x="872" y="695" class="bs">config.yml (env &gt; ./config.yml &gt; /etc/iot-platform)</text>
  </g>

  <!-- Web UI row -->
  <rect x="290" y="728" width="780" height="78" rx="8" class="row"/>
  <text x="304" y="750" class="hdr">WEB UI</text>
  <rect x="300" y="758" width="760" height="40" rx="6" class="item"/><rect x="300" y="758" width="4" height="40" fill="#06b6d4"/>
  <text x="680" y="775" class="bt">React 19 + Bootstrap 5 dashboard, embedded via go:embed</text>
  <text x="680" y="791" class="bs">Overview &#183; MQTT &#183; Products &#183; Devices &#183; Events &#183; Logs &#183; OTA &#183; Users &#183; Account &#183; Audit Log &#183; Docs &#183; Settings</text>

  <!-- internal flow -->
  <path d="M680,380 V396" class="line" marker-end="url(#arr)"/>
  <path d="M680,592 V608" class="line" marker-end="url(#arr)"/>

  <!-- Devices -->
  <rect x="30" y="268" width="200" height="160" rx="10" class="ext"/>
  <text x="130" y="296" class="bt">ESP32 devices</text>
  <text x="130" y="318" class="bs">username product.device</text>
  <text x="130" y="334" class="bs">password = access token</text>
  <text x="130" y="356" class="mono">v1/me/&#8230; (short)</text>
  <text x="130" y="372" class="mono">iot/v1/{p}/{d}/&#8230; (full)</text>
  <text x="130" y="398" class="bs">telemetry &#183; events &#183; logs</text>
  <text x="130" y="414" class="bs">RPC &#183; attributes &#183; OTA</text>
  <path d="M232,335 H298" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="264" y="327" fill="#8fb3ff" font-size="11" text-anchor="middle">MQTT</text>
  <path d="M130,268 V206 H288" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="140" y="198" fill="#8fb3ff" font-size="11">HTTP: firmware download</text>

  <!-- Right-side clients -->
  <rect x="1120" y="100" width="250" height="80" rx="10" class="ext"/>
  <text x="1245" y="128" class="bt">Browser</text><text x="1245" y="146" class="bs">operators &#183; admins</text><text x="1245" y="164" class="mono">HTTPS &#183; REST + WS (JWT)</text>
  <path d="M1118,150 H1072" class="line" marker-end="url(#arr)"/>

  <rect x="1120" y="194" width="250" height="72" rx="10" class="ext"/>
  <text x="1245" y="222" class="bt">AI client (Cursor, Claude)</text><text x="1245" y="244" class="mono">MCP &#183; Bearer JWT / API token</text>
  <path d="M1118,230 H1072" class="line" marker-end="url(#arr)"/>

  <rect x="1120" y="280" width="250" height="80" rx="10" class="ext"/>
  <text x="1245" y="307" class="bt">Node-RED (optional)</text><text x="1245" y="325" class="bs">connects as an external plugin</text><text x="1245" y="343" class="mono">MQTT &#183; events &#8596; commands</text>
  <path d="M1118,318 H1072" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <rect x="1120" y="374" width="250" height="80" rx="10" class="ext"/>
  <text x="1245" y="401" class="bt">External plugins</text><text x="1245" y="419" class="bs">any language (Go, Python, Java, C++)</text><text x="1245" y="437" class="mono">MQTT &#183; extplg_{account}_{id}</text>
  <path d="M1118,414 H1100 V352 H1072" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <rect x="1120" y="470" width="250" height="72" rx="10" class="ext"/>
  <text x="1245" y="497" class="bt">Prometheus</text><text x="1245" y="519" class="mono">scrape exporter :9100</text>
  <path d="M1118,506 H1072" class="line" marker-end="url(#arr)"/>

  <rect x="1120" y="556" width="250" height="60" rx="10" class="ext"/>
  <text x="1245" y="582" class="bt">SMTP server</text><text x="1245" y="600" class="bs">verification &#183; invitations</text>
  <path d="M1072,586 H1118" class="line" marker-end="url(#arr)"/>

  <text x="30" y="845" class="muted">Source: docs/images/architecture.svg &#183; Mermaid version: docs/en/14-diagrams.md#platform-architecture</text>
</svg>
