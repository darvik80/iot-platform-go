services:
  platform:
    image: ${IOT_IMAGE:-localhost/iot-platform-go:latest}
    build:
      context: ..
      args:
        VERSION: ${IOT_VERSION:-dev}
    container_name: ${IOT_CONTAINER_NAME:-iot-platform-go}
    restart: unless-stopped
    # Host ports are configurable; container ports are fixed by the image.
    ports:
      - "${IOT_HTTP_PORT:-8080}:8080"
      - "${IOT_MQTT_PORT:-1883}:1883"
      - "${IOT_MQTT_WS_PORT:-8083}:8083"
      - "${IOT_MQTT_TLS_PORT:-8883}:8883"
    environment:
      # Announce the host-side ports in device credentials / Settings.
      MQTT_PUBLIC_PORT: ${IOT_MQTT_PORT:-1883}
      MQTT_WS_PUBLIC_PORT: ${IOT_MQTT_WS_PORT:-8083}
      MQTT_TLS_PUBLIC_PORT: ${IOT_MQTT_TLS_PORT:-8883}
    # Optional platform settings (PUBLIC_BASE_URL, JWT_SECRET, SMTP_*, ...).
    # Only variables present in the file are passed, so config.yml from the
    # setup wizard still applies to everything left out.
    env_file:
      - path: ./platform.env
        required: false
    volumes:
      - ${IOT_DATA_DIR:-./iot/data}:/opt/iot-platform/lib
      - ${IOT_ETC_DIR:-./iot/etc}:/opt/iot-platform/etc

  nodered:
    image: nodered/node-red:4.0
    container_name: cogitor-nodered
    hostname: nodered
    restart: unless-stopped
    profiles: ["nodered"]
    ports:
      - "${NODERED_PORT:-1880}:1880"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODERED_CREDENTIAL_SECRET: ${NODERED_CREDENTIAL_SECRET:-cogitor-nodered-dev}
      # Container runtime: Docker=host.docker.internal, Podman=host.containers.internal
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-host.docker.internal}
      # Account slug of the external plugin used by Node-RED (extplg_{slug}_{id})
      ACCOUNT_SLUG: ${ACCOUNT_SLUG:-default}
    entrypoint: ["/entrypoint-custom.sh"]
    volumes:
      - ./nodered/data:/data
      - ./nodered/settings.js:/data/settings.js:ro
      - ./nodered/flows.json:/templates/flows.json:ro
      - ./nodered/entrypoint.sh:/entrypoint-custom.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
