// Plugin Protocol — gRPC interface for external plugins
//
// This defines the communication protocol between the IoT Platform
// and external plugins running as gRPC servers.

syntax = "proto3";

package plugin;

option go_package = "crearts-iot-platform/internal/grpc/plugin";

// PluginService is implemented by the plugin.
// The platform connects as a gRPC client and calls these methods.
service PluginService {
  // OnEvent is called when a device event occurs.
  rpc OnEvent(OnEventRequest) returns (OnEventResponse);

  // ApplyConfig is called when the plugin is bound to a device
  // or when the configuration changes.
  rpc ApplyConfig(ApplyConfigRequest) returns (ApplyConfigResponse);

  // Detach is called when the plugin is unbound from a device.
  rpc Detach(DetachRequest) returns (DetachResponse);

  // Health check
  rpc Ping(PingRequest) returns (PingResponse);
}

message OnEventRequest {
  int64 binding_id = 1;
  int64 device_pk = 2;
  string device_id = 3;
  string product_id = 4;
  string kind = 5;
  bytes payload = 6;
  bool online = 7;
  int64 timestamp = 8;
}

message OnEventResponse {
  bool ok = 1;
  string error = 2;
}

message ApplyConfigRequest {
  int64 binding_id = 1;
  int64 device_pk = 2;
  string device_id = 3;
  string product_id = 4;
  bytes config = 5;
}

message ApplyConfigResponse {
  bool ok = 1;
  string error = 2;
}

message DetachRequest {
  int64 binding_id = 1;
  int64 device_pk = 2;
}

message DetachResponse {
  bool ok = 1;
  string error = 2;
}

message PingRequest {}

message PingResponse {
  bool ok = 1;
  string version = 2;
  string status = 3;
  int64 events_processed = 4;
  int64 uptime_sec = 5;
}
