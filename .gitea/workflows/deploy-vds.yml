name: Deploy VDS

# Static Linux binary → systemd on Cogitor VPS (iot.cogitor.dev).
# Infra: devops/cogitor ansible (`iot.yml`). Docs: docs/deploy-vds.md

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  SERVICE_NAME: iot-platform

jobs:
  build-and-deploy:
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Build platform binary
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          COMMIT="$(git rev-parse --short HEAD)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT}" -o bin/platform ./cmd/platform
          chmod +x bin/platform

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.IOT_DEPLOY_SSH_KEY }}
        run: |
          test -n "$SSH_KEY" || { echo "missing secret IOT_DEPLOY_SSH_KEY"; exit 1; }
          mkdir -p ~/.ssh
          # Write key preserving newlines (handles both multi-line and \n-encoded secrets)
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Debug: show key format (not content)
          echo "Key lines: $(wc -l < ~/.ssh/id_ed25519)"
          echo "Key starts: $(head -1 ~/.ssh/id_ed25519)"
          ssh-keygen -lf ~/.ssh/id_ed25519 || { echo "ERROR: invalid key format"; exit 1; }
          ssh-keyscan -H "${{ secrets.IOT_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload binary, install service, restart
        env:
          HOST: ${{ secrets.IOT_DEPLOY_HOST }}
          USER: ${{ secrets.IOT_DEPLOY_USER }}
        run: |
          test -n "$HOST" && test -n "$USER" || { echo "missing IOT_DEPLOY_HOST / IOT_DEPLOY_USER"; exit 1; }
          SSH="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          SCP="scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          $SCP bin/platform "$USER@$HOST:/tmp/iot-platform.new"
          $SCP deploy/iot-platform.service "$USER@$HOST:/tmp/iot-platform.service"
          sed -e "s|__SERVICE_NAME__|$SERVICE_NAME|g" \
              deploy/remote-deploy.sh | tr -d '\r' | \
            $SSH "$USER@$HOST" "cat > /tmp/deploy.sh"
          $SSH "$USER@$HOST" bash /tmp/deploy.sh
