name: Build .deb

# Builds the .deb package on push to master or manual trigger.
# The .deb is uploaded as a build artifact and (on version tags) as a Gitea Release.

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "deb=iot-platform_${VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: bash deb/build.sh "${{ steps.version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.deb }}
          path: dist/${{ steps.version.outputs.deb }}
          retention-days: 30

      # ── Create Gitea Release on version tags ─────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: https://gitea.com/actions/release-action@main
        with:
          files: dist/${{ steps.version.outputs.deb }}
          tag: ${{ github.ref_name }}
          title: "v${{ steps.version.outputs.version }}"
          body: |
            IoT Platform Go v${{ steps.version.outputs.version }}

            **Install:**
            ```
            sudo dpkg -i ${{ steps.version.outputs.deb }}
            sudo apt-get install -f
            ```

            After installation open `http://<host>:8080` to run the setup wizard.
          api_key: ${{ secrets.GITEA_TOKEN }}
