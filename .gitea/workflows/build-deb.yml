name: Build & Deploy

# Builds the .deb package, then runs independent downstream jobs:
#   deploy-vds  — installs .deb on VDS via SSH (master only, re-runnable)
#   publish     — uploads .deb to cogitor-products package registry
#   release     — creates a Gitea Release (version tags only)
#
# Each job can be re-run independently from the Gitea Actions UI.

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ── 1. Build ────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    name: Build .deb
    outputs:
      version: ${{ steps.version.outputs.version }}
      deb: ${{ steps.version.outputs.deb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "deb=iot-platform_${VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: bash deb/build.sh "${{ steps.version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ steps.version.outputs.deb }}
          path: dist/${{ steps.version.outputs.deb }}
          retention-days: 30

  # ── 2. Deploy to VDS (master only) ─────────────────────────────────
  deploy-vds:
    runs-on: ubuntu-latest
    name: Deploy to VDS
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download .deb
        uses: actions/download-artifact@v3
        with:
          name: ${{ needs.build.outputs.deb }}

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.IOT_DEPLOY_SSH_KEY }}
        run: |
          test -n "$SSH_KEY" || { echo "missing secret IOT_DEPLOY_SSH_KEY"; exit 1; }
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -lf ~/.ssh/id_ed25519 || { echo "ERROR: invalid key format"; exit 1; }
          ssh-keyscan -H "${{ secrets.IOT_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload .deb and install on VDS
        env:
          HOST: ${{ secrets.IOT_DEPLOY_HOST }}
          USER: ${{ secrets.IOT_DEPLOY_USER }}
          DEB: ${{ needs.build.outputs.deb }}
        run: |
          test -n "$HOST" && test -n "$USER" || { echo "missing IOT_DEPLOY_HOST / IOT_DEPLOY_USER"; exit 1; }
          SSH="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          SCP="scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          $SCP "$DEB" "$USER@$HOST:/tmp/${DEB}"
          $SSH "$USER@$HOST" "sudo dpkg -i /tmp/${DEB} && sudo apt-get install -f -y && rm -f /tmp/${DEB}"
          echo "deploy ok"

  # ── 3. Publish to cogitor-products ─────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    name: Publish to cogitor-products
    needs: build
    steps:
      - name: Download .deb
        uses: actions/download-artifact@v3
        with:
          name: ${{ needs.build.outputs.deb }}

      - name: Upload to cogitor-products
        env:
          GITEA_TOKEN: ${{ secrets.DEB_GITEA_TOKEN }}
          DEB: ${{ needs.build.outputs.deb }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          BASE="https://gitea.darvik.synology.me:8443/api/packages/Cogitor/generic/cogitor-products"
          AUTH="Authorization: token ${GITEA_TOKEN}"

          # Always update the rolling "latest" slot (delete old → upload new)
          curl -k -sSf -X DELETE -H "$AUTH" "${BASE}/latest/$(basename "$DEB")" || true
          curl -k -sSf -H "$AUTH" --upload-file "$DEB" "${BASE}/latest/$(basename "$DEB")"

          # Versioned slot — only on version tags (immutable release)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            curl -k -sSf -H "$AUTH" --upload-file "$DEB" "${BASE}/${VERSION}/$(basename "$DEB")"
            echo "published ${VERSION} + latest to cogitor-products"
          else
            echo "published latest to cogitor-products"
          fi

  # ── 4. Gitea Release (version tags only) ───────────────────────────
  release:
    runs-on: ubuntu-latest
    name: Create Gitea Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download .deb
        uses: actions/download-artifact@v3
        with:
          name: ${{ needs.build.outputs.deb }}

      - name: Create Release
        uses: https://gitea.com/actions/release-action@main
        with:
          files: ${{ needs.build.outputs.deb }}
          tag: ${{ github.ref_name }}
          title: "v${{ needs.build.outputs.version }}"
          body: |
            IoT Platform Go v${{ needs.build.outputs.version }}

            **Install:**
            ```
            sudo dpkg -i ${{ needs.build.outputs.deb }}
            sudo apt-get install -f
            ```

            After installation open `http://<host>:8080` to run the setup wizard.
          api_key: ${{ secrets.GITEA_TOKEN }}
