name: Deploy Docker

# Synology / Docker host runner. Docs: docs/en/13-deploy-docker.md
# VPS production uses build-deb.yml (systemd) instead.
#
# Everything below can be overridden with repository variables
# (Settings → Actions → Variables) without editing this file. Variables are
# read when a run starts: after changing one, re-run the workflow
# (workflow_dispatch) to recreate the container with the new values.

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# One deploy at a time: concurrent runs would race on docker rm / docker run.
concurrency:
  group: deploy-docker
  cancel-in-progress: false

env:
  CONTAINER_NAME: ${{ vars.IOT_CONTAINER_NAME || 'iot-platform-go' }}
  # Host ports → container ports 8080 / 1883 / 8083 / 8883.
  IOT_HTTP_PORT: ${{ vars.IOT_HTTP_PORT || '9083' }}
  IOT_MQTT_PORT: ${{ vars.IOT_MQTT_PORT || '1883' }}
  IOT_MQTT_WS_PORT: ${{ vars.IOT_MQTT_WS_PORT || '8083' }}
  IOT_MQTT_TLS_PORT: ${{ vars.IOT_MQTT_TLS_PORT || '8883' }}
  # Host directory with data/ (→ /opt/iot-platform/lib) and etc/ (→ /opt/iot-platform/etc).
  IOT_HOST_DIR: ${{ vars.IOT_HOST_DIR || '/volume1/docker/iot-platform-go' }}
  # Optional; empty values are not passed so config.yml from the setup wizard applies.
  PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
  BROKER_HOST_PUBLIC: ${{ vars.BROKER_HOST_PUBLIC }}
  TIMEZONE: ${{ vars.TIMEZONE }}
  # Synology's Docker daemon rejects newer client API versions.
  DOCKER_API_VERSION: ${{ vars.DOCKER_API_VERSION || '1.43' }}

jobs:
  deploy:
    name: Build & deploy
    # Must be the runner on the Docker host itself: the image is built and run there.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show effective settings
        run: |
          echo "runner    : $(hostname)"
          docker info --format 'daemon    : {{.Name}} ({{.OperatingSystem}}, docker {{.ServerVersion}})'
          echo "container : $CONTAINER_NAME"
          echo "ports     : http $IOT_HTTP_PORT, mqtt $IOT_MQTT_PORT, ws $IOT_MQTT_WS_PORT, tls $IOT_MQTT_TLS_PORT"
          echo "host dir  : $IOT_HOST_DIR/{data,etc}"
          echo "public url: ${PUBLIC_BASE_URL:-<config.yml>}, broker host: ${BROKER_HOST_PUBLIC:-<config.yml>}, tz: ${TIMEZONE:-<config.yml>}"

      - name: Build image
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          COMMIT="$(git rev-parse --short HEAD)"
          docker build --pull \
            --build-arg VERSION="$VERSION" --build-arg COMMIT="$COMMIT" \
            -t "localhost/$CONTAINER_NAME:latest" .

      - name: Recreate container
        run: |
          set -- \
            -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$IOT_HTTP_PORT:8080" \
            -p "$IOT_MQTT_PORT:1883" \
            -p "$IOT_MQTT_WS_PORT:8083" \
            -p "$IOT_MQTT_TLS_PORT:8883" \
            -e "MQTT_PUBLIC_PORT=$IOT_MQTT_PORT" \
            -e "MQTT_WS_PUBLIC_PORT=$IOT_MQTT_WS_PORT" \
            -e "MQTT_TLS_PUBLIC_PORT=$IOT_MQTT_TLS_PORT" \
            -v "$IOT_HOST_DIR/data:/opt/iot-platform/lib" \
            -v "$IOT_HOST_DIR/etc:/opt/iot-platform/etc"
          for v in PUBLIC_BASE_URL BROKER_HOST_PUBLIC TIMEZONE; do
            eval "val=\${$v}"
            if [ -n "$val" ]; then set -- "$@" -e "$v=$val"; fi
          done
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker run "$@" "localhost/$CONTAINER_NAME:latest"

      - name: Wait for healthy
        run: |
          state() { docker inspect -f '{{.State.Status}} restarts={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_NAME" 2>/dev/null || echo missing; }
          ok=0
          for i in $(seq 1 40); do
            s="$(state)"; echo "$s"
            case "$s" in
              "running restarts=0 health=healthy") ok=1; break ;;
              missing|exited*|dead*|*restarts=[1-9]*|*health=unhealthy*) break ;;
            esac
            sleep 3
          done
          if [ "$ok" = 1 ]; then
            # Healthy once is not enough: make sure it stays up.
            sleep 30
            s="$(state)"; echo "after 30s: $s"
            [ "$s" = "running restarts=0 health=healthy" ] || ok=0
          fi
          docker ps -a --filter "name=^/${CONTAINER_NAME}$" --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          if [ "$ok" != 1 ]; then
            docker logs --tail 100 "$CONTAINER_NAME" || true
            exit 1
          fi

      - name: Prune dangling images
        if: always()
        run: docker image prune -f >/dev/null || true
