name: Build & Deploy Docker

# Builds Docker image, deploys to Synology (master),
# pushes to Gitea container registry, tags on v*.
# Each job can be re-run independently.

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

env:
  CONTAINER_NAME: iot-platform-go
  REGISTRY: gitea.darvik.synology.me:8443
  REGISTRY_USER: darvik

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
  # ── 1. Build image ──────────────────────────────────────────────────
  build:
    name: Build Docker image
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/iot-platform:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT="$(git rev-parse --short HEAD)"
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$COMMIT" \
            -t localhost/${{ env.CONTAINER_NAME }}:latest \
            -t "${{ steps.version.outputs.image }}" \
            .

      - name: Save image as artifact
        run: |
          docker save localhost/${{ env.CONTAINER_NAME }}:latest | gzip > /tmp/${{ env.CONTAINER_NAME }}.tar.gz
          echo "saved $(du -h /tmp/${{ env.CONTAINER_NAME }}.tar.gz | cut -f1)"

      - name: Upload image artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.CONTAINER_NAME }}-image
          path: /tmp/${{ env.CONTAINER_NAME }}.tar.gz
          retention-days: 7

  # ─ 2. Deploy to Synology (master only) ─────────────────────────────
  deploy-synology:
    name: Deploy to Synology
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download image
        uses: actions/download-artifact@v3
        with:
          name: ${{ env.CONTAINER_NAME }}-image
          path: /tmp

      - name: Load and restart container
        run: |
          export DOCKER_API_VERSION=1.43
          docker load -i /tmp/${{ env.CONTAINER_NAME }}.tar.gz
          
          # Remove old container and anything else using our ports
          docker rm -f ${{ env.CONTAINER_NAME }} || true
          docker ps --format '{{.ID}} {{.Ports}}' | grep -E '0.0.0.0:(1883|8083|9083)->' | awk '{print $1}' | xargs -r docker rm -f || true
          
          docker run \
            -d \
            -p 9083:8080 \
            -p 1883:1883 \
            -p 8083:8083 \
            --restart unless-stopped \
            --name ${{ env.CONTAINER_NAME }} \
            -v /volume1/docker/${{ env.CONTAINER_NAME }}/data:/opt/iot-platform/lib \
            -v /volume1/docker/${{ env.CONTAINER_NAME }}/etc:/opt/iot-platform/etc \
            localhost/${{ env.CONTAINER_NAME }}:latest
          echo "deploy ok"

  # ── 3. Push to Gitea registry (all pushes) ──────────────────────────
  publish-registry:
    name: Push to Gitea registry
    needs: build
    steps:
      - name: Download image
        uses: actions/download-artifact@v3
        with:
          name: ${{ env.CONTAINER_NAME }}-image
          path: /tmp

      - name: Login and push
        env:
          REGISTRY_TOKEN: ${{ secrets.DEB_GITEA_TOKEN }}
        run: |
          test -n "$REGISTRY_TOKEN" || { echo "missing secret DEB_GITEA_TOKEN"; exit 1; }
          echo "${REGISTRY_TOKEN}" | docker login ${{ env.REGISTRY }} -u "${{ env.REGISTRY_USER }}" --password-stdin
          docker load -i /tmp/${{ env.CONTAINER_NAME }}.tar.gz
          docker tag localhost/${{ env.CONTAINER_NAME }}:latest "${{ needs.build.outputs.image }}"
          docker push "${{ needs.build.outputs.image }}"

          # Also push latest tag
          docker tag localhost/${{ env.CONTAINER_NAME }}:latest "${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/iot-platform:latest"
          docker push "${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/iot-platform:latest"
          echo "pushed to Gitea registry"

  # ─ 4. Gitea Release (version tags only) ───────────────────────────
  release:
    name: Create Gitea Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download image
        uses: actions/download-artifact@v3
        with:
          name: ${{ env.CONTAINER_NAME }}-image
          path: /tmp

      - name: Create Release
        uses: https://gitea.com/actions/release-action@main
        with:
          files: /tmp/${{ env.CONTAINER_NAME }}.tar.gz
          tag: ${{ github.ref_name }}
          title: "v${{ needs.build.outputs.version }}"
          body: |
            IoT Platform Go v${{ needs.build.outputs.version }}

            **Docker:**
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/iot-platform:${{ needs.build.outputs.version }}
            ```
          api_key: ${{ secrets.GITEA_TOKEN }}
