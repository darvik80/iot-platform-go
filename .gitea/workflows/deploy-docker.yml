name: Deploy Docker

# Synology / Docker host runner. Docs: docs/deploy-docker.md
# VPS production uses deploy-vds.yml (systemd) instead.

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  TARGET_PORT: 9083
  TARGET_MQTT_PORT: 1883
  TARGET_MQTT_WS_PORT: 8083
  CONTAINER_NAME: iot-platform-go

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare data directory
        run: |
          mkdir -p /volume1/docker/$CONTAINER_NAME/data
          mkdir -p /volume1/docker/$CONTAINER_NAME/etc

      - name: Build docker image
        run: |
          export DOCKER_API_VERSION=1.43
          VERSION="$(tr -d '[:space:]' < version.txt)"
          COMMIT="$(git rev-parse --short HEAD)"
          docker build --build-arg VERSION="$VERSION" --build-arg COMMIT="$COMMIT" -t localhost/$CONTAINER_NAME:latest .

      - name: Restart iot-platform
        run: |
          export DOCKER_API_VERSION=1.43
          docker rm -f $CONTAINER_NAME || true
          docker run \
            -d \
            -p $TARGET_PORT:8080 \
            -p $TARGET_MQTT_PORT:1883 \
            -p $TARGET_MQTT_WS_PORT:8083 \
            --restart unless-stopped \
            --name $CONTAINER_NAME \
            -v /volume1/docker/$CONTAINER_NAME/data:/data \
            -v /volume1/docker/$CONTAINER_NAME/etc:/etc/iot-platform \
              localhost/$CONTAINER_NAME:latest
