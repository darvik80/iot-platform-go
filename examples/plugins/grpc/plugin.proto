// Plugin Protocol — gRPC interface for external plugins
//
// This defines the communication protocol between the IoT Platform
// and external plugins running as subprocesses.
//
// The plugin implements the PluginService and listens on a Unix socket
// or TCP port. The platform connects as a gRPC client.

syntax = "proto3";

package plugin;

option go_package = "cogitor-iot-platform/proto/plugin";

// PluginService is implemented by the plugin.
// The platform calls these methods to notify the plugin about events.
service PluginService {
  // OnEvent is called when a device event occurs.
  // The plugin is bound to a device and receives telemetry, status, etc.
  rpc OnEvent(OnEventRequest) returns (OnEventResponse);

  // ApplyConfig is called when the plugin is bound to a device
  // or when the configuration changes.
  rpc ApplyConfig(ApplyConfigRequest) returns (ApplyConfigResponse);

  // Detach is called when the plugin is unbound from a device.
  rpc Detach(DetachRequest) returns (DetachResponse);

  // Health check
  rpc Ping(PingRequest) returns (PingResponse);
}

// OnEventRequest contains the event data from a device.
message OnEventRequest {
  // Binding ID — unique identifier for this plugin-device binding
  int64 binding_id = 1;
  
  // Device primary key in the platform database
  int64 device_pk = 2;
  
  // Device ID (product-specific identifier)
  string device_id = 3;
  
  // Product ID
  string product_id = 4;
  
  // Event kind: "telemetry", "status", "event", "log", "ota", "tick"
  string kind = 5;
  
  // Event payload — structure depends on kind
  // For telemetry: {"metrics": {"temperature": 23.5, ...}}
  // For status: {"online": true}
  // For event: {"type": "button_press", ...}
  bytes payload = 6;
  
  // Device online status (for status events)
  bool online = 7;
  
  // Timestamp (Unix milliseconds)
  int64 timestamp = 8;
}

message OnEventResponse {
  bool ok = 1;
  // Optional error message
  string error = 2;
}

// ApplyConfigRequest is sent when binding to a device or config changes.
message ApplyConfigRequest {
  int64 binding_id = 1;
  int64 device_pk = 2;
  string device_id = 3;
  string product_id = 4;
  
  // Plugin-specific configuration (JSON-encoded)
  bytes config = 5;
}

message ApplyConfigResponse {
  bool ok = 1;
  string error = 2;
}

// DetachRequest is sent when unbinding from a device.
message DetachRequest {
  int64 binding_id = 1;
  int64 device_pk = 2;
}

message DetachResponse {
  bool ok = 1;
  string error = 2;
}

message PingRequest {}

message PingResponse {
  bool ok = 1;
  // Plugin version
  string version = 2;
  // Plugin status: "ok", "busy", "error"
  string status = 3;
  // Optional stats
  int64 events_processed = 4;
  int64 uptime_sec = 5;
}
